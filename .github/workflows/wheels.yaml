# Сборка колеса для личного ассистента (копия amanita-tech). Сценарий автора (coleifer/sqlcipher3,
# .github/workflows/wheels.yaml, cibuildwheel) сужен до одного колеса — Windows AMD64 cp314 — и
# вместо публикации в PyPI кладёт колесо в релиз этой копии вместе с SHA256SUMS.
# Отличия от исходного сценария перечислены в SBORKA-AMANITA.md.
name: Build wheels
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-**"
  # Пробная сборка без тега: колесо остаётся артефактом запуска, релиз не создаётся.
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            cibw_archs: AMD64
            cibw_build: "cp314-*"
            cibw_skip: ""
            compile_target: x86_64
            out: x86_64-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels for ${{ matrix.os }} ${{ matrix.cibw_archs }} ${{ matrix.cibw_build }}
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: ${{ matrix.cibw_skip }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ENVIRONMENT: SQLCIPHER3_COMPILE_TARGET=${{ matrix.compile_target }}
          CIBW_TEST_COMMAND: >
            mv {project}/sqlcipher3 {project}/sqlcipher3_ &&
            python {project}/tests/ &&
            mv {project}/sqlcipher3_ {project}/sqlcipher3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.out }}
          path: wheelhouse/*.whl

  # Сверка готового колеса на чистом Python 3.14: внутри именно то ядро SQLCipher и тот OpenSSL,
  # что заявлены меткой версии и conanfile.py (amanita/proverit_koleso.py).
  proverka:
    needs: wheels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-x86_64-windows
          path: wheelhouse

      - name: Поставить колесо и сверить
        shell: bash
        run: |
          set -euo pipefail
          koleso=$(ls wheelhouse/*.whl)
          echo "Колесо: $koleso"
          python -m pip install --no-deps "$koleso"
          python amanita/proverit_koleso.py "$koleso"

  # Релиз копии: колесо, SHA256SUMS и подтверждение происхождения (attestation). Только по тегу.
  vypusk:
    needs: proverka
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-x86_64-windows
          path: wheelhouse

      - name: Контрольные суммы
        run: |
          cd wheelhouse
          sha256sum *.whl | tee SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: wheelhouse/*.whl

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" wheelhouse/*.whl wheelhouse/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Колесо $GITHUB_REF_NAME (Windows AMD64, cp314)" \
            --notes "Собрано сценарием .github/workflows/wheels.yaml по тегу $GITHUB_REF_NAME. Контрольные суммы — в SHA256SUMS. Как пользоваться и как поднимать версию — SBORKA-AMANITA.md."
